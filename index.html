<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Electron Savegame Viewer + Hash Encryptor</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #111827; background: #f3f4f6; }
    body { margin: 0; padding: 32px; }
    main { max-width: 1100px; margin: 0 auto; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 22px; box-shadow: 0 10px 25px rgba(0,0,0,.04); margin-bottom: 18px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #4b5563; line-height: 1.5; }
    label { display: block; font-weight: 650; margin: 14px 0 6px; }
    input, textarea, button { font: inherit; }
    input[type="text"], textarea { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 10px; padding: 11px 12px; }
    textarea { min-height: 130px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    button { border: 0; border-radius: 10px; padding: 11px 16px; background: #111827; color: white; font-weight: 650; cursor: pointer; margin-top: 14px; }
    button.secondary { background: #374151; margin-left: 8px; }
    button.success { background: #047857; margin-left: 8px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .status { margin-top: 12px; padding: 11px 12px; border-radius: 10px; white-space: pre-wrap; }
    .ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .bad { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    pre { margin: 0; overflow: auto; max-height: 70vh; background: #0b1020; color: #e5e7eb; padding: 16px; border-radius: 12px; font-size: 13px; line-height: 1.45; }
    .hint { font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Scratch Inc savegame editor/viewer</h1>

    <label for="key">Key / DevName</label>
    <input id="key" type="text" value="Zack Stein" autocomplete="off" />

    <label for="file">Savefile importeren</label>
    <input id="file" type="file" />

    <label for="saveText">Of plak de save-string</label>
    <textarea id="saveText" placeholder="U2FsdGVkX1..."></textarea>

    <div class="row">
      <button id="decryptBtn">Decrypt & toon JSON</button>
      <button id="copyBtn" class="secondary" disabled>Kopieer JSON</button>
      <button id="downloadBtn" class="secondary" disabled>Download JSON</button>
      <button id="encryptBtn" class="success">Encrypt JSON naar save</button>
      <button id="copySaveBtn" class="secondary" disabled>Kopieer encrypted save</button>
    </div>
    <div id="status" class="status hint">Nog niets gedecrypt.</div>
  </section>

  <section class="card">
    <label for="jsonEditor">Gedecrypte JSON / edit hier</label>
    <textarea id="jsonEditor" style="min-height: 360px">{}</textarea>
    <label for="encryptedOutput">Nieuwe encrypted save-string</label>
    <textarea id="encryptedOutput" readonly placeholder="Hier verschijnt je opnieuw encrypted save..."></textarea>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let lastJsonText = "";

$("file").addEventListener("change", async (event) => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  $("saveText").value = (await file.text()).trim();
});

$("decryptBtn").addEventListener("click", async () => {
  setStatus("Bezig met decrypten...", "hint");
  $("copyBtn").disabled = true;
  $("downloadBtn").disabled = true;
  lastJsonText = "";

  try {
    const encrypted = $("saveText").value.trim().replace(/^\uFEFF/, "");
    const passphrase = $("key").value;
    if (!encrypted) throw new Error("Geen save-string gevonden.");
    if (!passphrase) throw new Error("Geen key ingevuld.");

    const plainText = await decryptOpenSslCryptoJsAes(encrypted, passphrase);
    const parsed = JSON.parse(plainText);
    lastJsonText = JSON.stringify(parsed, null, 2);
    $("jsonEditor").value = lastJsonText;
    $("encryptedOutput").value = "";
    $("copySaveBtn").disabled = true;

    const hasHash = parsed && Object.prototype.hasOwnProperty.call(parsed, "_hash");
    setStatus("Gelukt. JSON gedecrypt" + (hasHash ? " en _hash veld gevonden." : ". Geen _hash veld gevonden."), "ok");
    $("copyBtn").disabled = false;
    $("downloadBtn").disabled = false;
  } catch (err) {
    $("jsonEditor").value = "{}";
    setStatus("Fout: " + err.message, "bad");
  }
});

$("copyBtn").addEventListener("click", async () => {
  if (!lastJsonText) return;
  await navigator.clipboard.writeText(lastJsonText);
  setStatus("JSON gekopieerd naar klembord.", "ok");
});


$("encryptBtn").addEventListener("click", async () => {
  setStatus("Bezig met encrypten...", "hint");
  $("copySaveBtn").disabled = true;
  $("encryptedOutput").value = "";

  try {
    const passphrase = $("key").value;
    if (!passphrase) throw new Error("Geen key ingevuld.");

    const jsonText = $("jsonEditor").value.trim();
    if (!jsonText) throw new Error("Geen JSON om te encrypten.");

    const parsed = JSON.parse(jsonText);
    const hash = await generateSaveHash(parsed);
    parsed._hash = hash;

    const normalizedJson = JSON.stringify(parsed);
    const encrypted = await encryptOpenSslCryptoJsAes(normalizedJson, passphrase);
    $("jsonEditor").value = JSON.stringify(parsed, null, 2);
    lastJsonText = $("jsonEditor").value;
    $("copyBtn").disabled = false;
    $("downloadBtn").disabled = false;
    $("encryptedOutput").value = encrypted;
    $("copySaveBtn").disabled = false;

    setStatus("Encrypted save gemaakt met opnieuw berekende _hash: " + hash, "ok");
  } catch (err) {
    setStatus("Fout: " + err.message, "bad");
  }
});

$("copySaveBtn").addEventListener("click", async () => {
  const text = $("encryptedOutput").value.trim();
  if (!text) return;
  await navigator.clipboard.writeText(text);
  setStatus("Encrypted save gekopieerd naar klembord.", "ok");
});

$("downloadBtn").addEventListener("click", () => {
  const text = $("jsonEditor").value.trim();
  if (!text) return;
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "decrypted-save.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

function setStatus(text, kind) {
  const el = $("status");
  el.textContent = text;
  el.className = "status " + kind;
}


async function generateSaveHash(saveObject) {

  const clonedObject = JSON.parse(JSON.stringify(saveObject));
  delete clonedObject._hash;
  const data = new TextEncoder().encode(JSON.stringify(clonedObject));
  const digest = await crypto.subtle.digest("SHA-256", data);
  return bytesToHex(new Uint8Array(digest));
}

function bytesToHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function decryptOpenSslCryptoJsAes(base64CipherText, passphrase) {
  const raw = base64ToBytes(base64CipherText);
  const marker = bytesToAscii(raw.slice(0, 8));
  if (marker !== "Salted__") {
    throw new Error("Deze save begint niet met OpenSSL Salted__ data. Check of je de volledige export-string hebt geplakt.");
  }

  const salt = raw.slice(8, 16);
  const cipherText = raw.slice(16);
  const passBytes = new TextEncoder().encode(passphrase);

  // CryptoJS/OpenSSL passphrase mode derives key+IV via EVP_BytesToKey using MD5.
  // AES key size is 256-bit, IV is 128-bit, so we need 48 bytes total.
  const keyIv = await evpBytesToKeyMd5(passBytes, salt, 48);
  const keyBytes = keyIv.slice(0, 32);
  const ivBytes = keyIv.slice(32, 48);

  const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-CBC" }, false, ["decrypt"]);
  let decrypted;
  try {
    decrypted = await crypto.subtle.decrypt({ name: "AES-CBC", iv: ivBytes }, key, cipherText);
  } catch (e) {
    throw new Error("AES decryptie mislukt. Waarschijnlijk is de key fout of de save-string beschadigd.");
  }

  return new TextDecoder("utf-8", { fatal: false }).decode(decrypted);
}


async function encryptOpenSslCryptoJsAes(plainText, passphrase) {
  const salt = crypto.getRandomValues(new Uint8Array(8));
  const passBytes = new TextEncoder().encode(passphrase);
  const keyIv = await evpBytesToKeyMd5(passBytes, salt, 48);
  const keyBytes = keyIv.slice(0, 32);
  const ivBytes = keyIv.slice(32, 48);

  const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-CBC" }, false, ["encrypt"]);
  const plainBytes = new TextEncoder().encode(plainText);
  const cipherBuffer = await crypto.subtle.encrypt({ name: "AES-CBC", iv: ivBytes }, key, plainBytes);
  const header = new TextEncoder().encode("Salted__");
  return bytesToBase64(concatBytes(header, salt, new Uint8Array(cipherBuffer)));
}

async function evpBytesToKeyMd5(passwordBytes, saltBytes, targetLength) {
  const chunks = [];
  let totalLength = 0;
  let previous = new Uint8Array(0);

  while (totalLength < targetLength) {
    const input = concatBytes(previous, passwordBytes, saltBytes);
    previous = md5(input);
    chunks.push(previous);
    totalLength += previous.length;
  }
  return concatBytes(...chunks).slice(0, targetLength);
}

function base64ToBytes(base64) {
  const cleaned = base64.replace(/\s+/g, "");
  let binary;
  try {
    binary = atob(cleaned);
  } catch (e) {
    throw new Error("Ongeldige base64/save-string.");
  }
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}


function bytesToBase64(bytes) {
  let binary = "";
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode(...bytes.slice(i, i + chunkSize));
  }
  return btoa(binary);
}

function bytesToAscii(bytes) {
  return Array.from(bytes).map(b => String.fromCharCode(b)).join("");
}

function concatBytes(...arrays) {
  const length = arrays.reduce((sum, arr) => sum + arr.length, 0);
  const out = new Uint8Array(length);
  let offset = 0;
  for (const arr of arrays) {
    out.set(arr, offset);
    offset += arr.length;
  }
  return out;
}

// Small MD5 implementation, public-domain style compact version adapted for Uint8Array input.
function md5(inputBytes) {
  function leftRotate(x, c) { return (x << c) | (x >>> (32 - c)); }
  function add32(a, b) { return (a + b) >>> 0; }
  const s = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K = new Uint32Array(64);
  for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 2 ** 32) >>> 0;

  const bitLen = inputBytes.length * 8;
  const paddedLen = (((inputBytes.length + 8) >> 6) + 1) << 6;
  const bytes = new Uint8Array(paddedLen);
  bytes.set(inputBytes);
  bytes[inputBytes.length] = 0x80;
  const view = new DataView(bytes.buffer);
  view.setUint32(paddedLen - 8, bitLen >>> 0, true);
  view.setUint32(paddedLen - 4, Math.floor(bitLen / 2 ** 32), true);

  let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;

  for (let offset = 0; offset < paddedLen; offset += 64) {
    const M = new Uint32Array(16);
    for (let i = 0; i < 16; i++) M[i] = view.getUint32(offset + i * 4, true);

    let A = a0, B = b0, C = c0, D = d0;
    for (let i = 0; i < 64; i++) {
      let F, g;
      if (i < 16) { F = (B & C) | (~B & D); g = i; }
      else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
      else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7 * i) % 16; }
      F = add32(add32(F >>> 0, A), add32(K[i], M[g]));
      A = D;
      D = C;
      C = B;
      B = add32(B, leftRotate(F, s[i]));
    }
    a0 = add32(a0, A); b0 = add32(b0, B); c0 = add32(c0, C); d0 = add32(d0, D);
  }

  const out = new Uint8Array(16);
  const outView = new DataView(out.buffer);
  outView.setUint32(0, a0, true);
  outView.setUint32(4, b0, true);
  outView.setUint32(8, c0, true);
  outView.setUint32(12, d0, true);
  return out;
}
</script>
</body>
</html>
